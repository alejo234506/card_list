<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina semanal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="cabecera">
        <div class="cabecera__texto">
            <p class="fecha" id="fecha"></p>
            <h1>Rutina semanal</h1>
            <p class="mensaje" id="mensaje"></p>
        </div>

        <div class="resumen" aria-live="polite">
            <div class="anillo" id="anillo">
                <span id="porcentaje">0%</span>
            </div>
            <div class="resumen__texto">
                <strong id="hechas">0</strong> de <span id="total">0</span> tareas
                <small>completadas esta semana</small>
            </div>
        </div>
    </header>

    <nav class="controles">
        <div class="filtros" id="filtros">
            <button type="button" class="filtro" data-filtro="semana">Toda la semana</button>
            <button type="button" class="filtro" data-filtro="hoy">Solo hoy</button>
            <button type="button" class="filtro" data-filtro="pendientes">Pendientes</button>
        </div>
        <div class="acciones">
            <button type="button" id="seleccionar" class="btn-papel">☑ Seleccionar</button>
            <button type="button" id="tema" class="btn-icono" aria-label="Cambiar entre tema claro y oscuro">🌙</button>
            <button type="button" id="reiniciar" class="btn-peligro">Reiniciar semana</button>
        </div>
    </nav>

    <main class="tarjetas" id="tarjetas"></main>

    <footer class="pie">
        Haz clic en una tarea para marcarla · ✏️ para editarla · ☑ Seleccionar para borrar varias · Todo se guarda automáticamente
    </footer>

    <!-- Barra que aparece al seleccionar varias tareas -->
    <div class="barra-seleccion" id="barraSeleccion" hidden>
        <span id="cuentaSeleccion">0 seleccionadas</span>
        <button type="button" id="selHechas">Elegir las hechas</button>
        <button type="button" id="borrarSeleccion" class="btn-borrar" disabled>🗑 Borrar</button>
        <button type="button" id="cancelarSeleccion">Cancelar</button>
    </div>

    <!-- Aviso con opción de deshacer -->
    <div class="aviso" id="aviso" role="status" hidden>
        <span id="avisoTexto"></span>
        <button type="button" id="deshacer">Deshacer</button>
    </div>

    <script src="./script.js"></script>
</body>

</html>
